<!DOCTYPE html>
<html lang="id">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARMS — Control Tower</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #020617;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      #arms-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #020617;
        z-index: 9999;
        text-align: center;
        padding: 24px;
      }
      #arms-boot .spinner {
        width: 38px;
        height: 38px;
        border: 3px solid #1e293b;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: arms-spin 0.9s linear infinite;
      }
      #arms-boot .title {
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      #arms-boot .sub {
        font-size: 12px;
        color: #94a3b8;
        max-width: 460px;
        line-height: 1.6;
      }
      @keyframes arms-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      // Penanda runtime: frontend memakai ini untuk mengarahkan seluruh panggilan
      // /api/* ke Google Apps Script (google.script.run) — bukan ke server HTTP.
      window.__ARMS_GAS_RUNTIME__ = true;
      window.__ARMS_CSS_PARTS__ = window.__ARMS_CSS_PARTS__ || [];
      window.__ARMS_JS_PARTS__ = window.__ARMS_JS_PARTS__ || [];
      window.__ARMS_BOOT_META__ = {
        version: '<?!= armsVersion ?>',
        scriptId: '<?!= armsScriptId ?>',
        runtime: 'google-apps-script'
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="arms-boot">
      <div class="spinner"></div>
      <div class="title">🏢 ARMS — Control Tower</div>
      <div class="sub">
        Memuat aplikasi dari Google Apps Script…<br />
        Database: spreadsheet aktif &nbsp;•&nbsp; Penyimpanan berkas: Google Drive
      </div>
    </div>
    <!-- Bundle frontend (hasil `npm run gas:build`) disisipkan di sini -->
<!--__ARMS_BUNDLE_INCLUDES__-->
    <?!= include('BundleRun') ?>
  </body>
</html>
